# ES futures price-path convexity, v5: run pc_es_v5_15m (path_convexity_v5_15m, 8,640 configs,
# 15-minute bars only) -- the ONE place every threshold lives.
# Specified by the user (2026-11-26) after v2 on ES (pc_es_v2_15m) and v3 on NQ (pc_nq_v3_15m) lost on
# their 2025+ holdouts. Read of the NQ v3 finalists (all development-selected, validation-seen): long-only
# configs had a median validation Sharpe of +0.65 (86% positive), both-sided +0.03, short-only -0.59; the
# plain-reversal control was the worst signal form. This grid therefore keeps only long / both, and adds:
#   look-back N = 20 / 26 / 52 / 78 / 130 bars (26 = one session; 130 = five sessions),
#   signal form paper / max gap / plain N-bar reversal (control), z-score history 25 / 100 bars,
#   entry |z| 1.0 / 1.5, quadrant all, minimum net move 2 / 3 ATR(14), long / both,
#   hold 8 / 16 bars / session (N-based holds all collapse to the session once N >= 20),
#   stop 2 / 3 ATR(14), no 15-minute EMA filter,
#   regime none / dtrend50 (long only above the prior sessions' 50-day SMA of daily closes, short only
#   below) / volhi (ATR(14)/close at or above its median over the last 1,300 bars),
#   window all / mid (the entry bar opens 10:00-15:00).
# No new entries in the last 30 minutes; flat at the session close. Run through validation ONLY: the holdout
# is not opened. The new axes (regime, window, fixed-bar holds, long look-backs) are guesses made after
# seeing the ES 2023-2024 results of the earlier rounds, so validation here is weak evidence.
#
# Every gate, data split and cost is identical to v3 on NQ (pc_funnel_nq_v3_15m.yaml) EXCEPT the grid,
# the strategy name and the symbol.
#
# Thresholds are fixed for the duration of a run and are hashed into every output. They are NEVER
# adjusted automatically to hit a survivor count; zero survivors is a valid outcome.

version: 1
strategy: path_convexity_v5_15m
symbol: ES
seed: 20261126

data:
  clean_root: data/clean
  development: {start: 2018-01-01, end: 2022-12-31}
  validation:  {start: 2023-01-01, end: 2024-12-31}
  # end: null -> the actual available endpoint, recorded at access time.
  holdout:     {start: 2025-01-01, end: null}
  timeframes: ["15min"]

data_history:
  validation_previously_used_for_selection: true
  validation_note: >-
    ES 2023-2024 was used to select v2 picks and by other families; the researcher has read those results. Treated as used for selection.
  holdout_previously_inspected: true
  holdout_note: >-
    ES v2 #115 was scored on ES 2025+ (lost). This run does not open the holdout.

metrics:
  return_frequency: daily          # mark-to-market equity at each session close
  periods_per_year: 252            # Sharpe = mean/std(daily) * sqrt(252)
  risk_free_rate_annual: 0.0
  cash_treatment: >-
    Idle cash earns 0% and the Sharpe excess return is measured against a 0%
    risk-free rate, so the two assumptions are consistent.
  drawdown_basis: daily session-close mark-to-market (understates intraday DD)

execution:
  baseline: configs/execution/futures.yaml   # $2.50/contract/side + 1 tick/side slippage, unlevered whole contracts

integrity:            # stage 1
  truncation_check_sample: 40
  truncation_points: 3

trade_count:          # stage 2 -- hard gate
  min_completed_trades: 100
  min_trades_per_year: 10
  min_years_meeting_floor: 4

performance:          # stage 3 -- hard gate
  min_net_return: 0.0               # strictly greater than
  min_sharpe: 0.75                  # annualized, daily MTM returns incl. flat days
  max_drawdown: -0.30
  max_drawdown_source: src/experiments/validation.py::FunnelThresholds.max_dev_drawdown_pct

parameter_stability:  # stage 4 -- hard gate
  mode: local_perturbation          # gate on `local` moves below; grid neighbors are diagnostic only
  local:
    int_rel: 0.20                   # look-back N, z look-back: x0.8 / x1.2, rounded, >= 1 bar away
    entry_z_abs: 0.25               # entry |z| -/+ 0.25 (never below 0.1)
    stop_atr_abs: 0.25              # numeric ATR stop -/+ 0.25 ("none" has no numeric move)
    min_move_atr_abs: 0.5           # minimum net move -/+ 0.5 ATR (never below 0)
  neighbor_mode: single_axis        # grid-neighbor diagnostic
  min_frac_profitable: 0.70         # of the local moves, share with dev net return > 0
  min_median_sharpe: 0.50           # median dev Sharpe of the local moves
  prescreen:                        # big grids: fixed before the run, like every gate
    max_configs: 3000               # if more than this many pass stage 3, cluster them first (stage-6 rules)
    per_cluster: 3                  # and send only the best 3 per cluster by dev Sharpe into stage 4
  perturbation:                     # diagnostic only, never a gate
    n_per_config: 20
    integer_rel_step: 0.15          # look-back N, z look-back
    float_rel_step: 0.10            # entry z, ATR stop, minimum net move (relative)

time_stability:       # stage 5 -- light hard gate + diagnostics
  min_profitable_years: 3
  top_trades_k: 5
  top_trades_frac: 0.05

dedup:                # stage 6
  corr_threshold: 0.80
  return_basis: monthly
  linkage: complete
  reps_per_cluster: 2               # best 2 per cluster; a single-member cluster keeps its 1

execution_stress:     # stage 7
  gate_cost_multiplier: 1.5         # hard gate: positive dev net return
  diagnostic_cost_multipliers: [2.0]
  entry_delay_bars: 1
  missed_entry_frac: 0.10
  missed_entry_sims: 100
  breakeven_max_multiplier: 25.0

validation:           # stage 8 -- hard gate (frozen representatives only)
  min_net_return: 0.0
  min_sharpe: 0.30
  max_drawdown: -0.30
  min_completed_trades: 40          # project default from 2026-10-22

confidence:           # stage 9 -- diagnostics only
  dsr_threshold: 0.95
  dsr_calibration_verified: false
  effective_trials_method: li_ji
  serial_dependence: lag1_effective_n
  transfer_symbol: NQ                # unchanged rules, development period only

holdout:              # stage 10 -- explicit `final-test` command only
  acceptance:
    min_net_return: 0.0
    min_sharpe: 0.0
    max_drawdown: -0.30
    min_completed_trades: null

