# Exact copy of cb_bbkc_funnel_es_v2_15m.yaml as it was when the selection manifest was frozen
# (2026-11-11T00:21Z): only the research_history entry for the 5m sibling differs (later re-specified).
# Used for the holdout final-test so the manifest's config hash check passes.
# ES futures (E-mini S&P 500) volatility-compression breakout, BB-inside-KC squeeze line, round 2:
# run cb_bbkc_es_v2_15m -- the ONE place every threshold lives. v2 has one grid per bar size,
# so it is two runs (cb_bbkc_es_v2_5m, cb_bbkc_es_v2_15m), shown as variants of one tab.
# (compression_breakout_bbkc_v2_15m, 184,320 configs, 15-minute bars only): squeeze length
# 5/10/15/20/25/30/40/50 bars, Keltner width 1/1.5/2/2.5/3 ATR, min squeeze bars 1/3/5, entry
# close / wick, setup live 1/3/6/9 bars, stop box / 1.5 / 2.5 / 3.5 ATR(14), target 2R/3R/4R/none,
# long / both, trend filter none / EMA(50), minimum box width any / 0.5 / 1 ATR(14).
# Specified by the user after reading ES v1's development and validation results (cb_bbkc_es_v1).
# No new entries in the last 30 minutes; flat at the session close. ES's day session is
# 09:30-16:00 NY. See src/strategies/compression_breakout/config.py.
#
# Every gate, threshold, data split and cost is identical to ES v1
# (configs/funnel/cb_bbkc_funnel_es_v1.yaml) EXCEPT the strategy / grid and the timeframe.
# Stage-4 local moves: squeeze length, min squeeze bars and setup expiry x0.8/x1.2, Keltner multiple -/+ 0.25,
#     ATR stop -/+ 0.25, target -/+ 0.5R, minimum box width -/+ 0.25 ATR.
#
# Thresholds are fixed for the duration of a run and are hashed into every run's
# outputs. They are NEVER adjusted automatically to hit a survivor count; zero
# survivors is a valid outcome. Changing a value here is a new research trial
# and should be recorded under `research_history` below.

version: 1
strategy: compression_breakout_bbkc_v2_15m
symbol: ES
seed: 20261110

data:
  clean_root: data/clean
  development: {start: 2018-01-01, end: 2022-12-31}
  validation:  {start: 2023-01-01, end: 2024-12-31}
  # end: null -> the actual available endpoint, recorded at access time.
  holdout:     {start: 2025-01-01, end: null}
  timeframes: ["15min"]

data_history:
  validation_previously_used_for_selection: true
  validation_note: >-
    cb_bbkc_es_v1 gated 63 ES squeeze candidates on 2023-2024 (36 passed), and this grid was
    chosen after reading those results. The mean-reversion and noise-band families were validated
    on ES 2023-2024 too. So ES 2023-2024 is largely in-sample here; the 2025+ holdout is the only
    untouched test.
  holdout_previously_inspected: false
  holdout_note: >-
    No compression-breakout metrics have been computed on ES 2025+. ES 2025+ bars were read for mean-reversion holdout scoring (combined_v1, mr_es_v6_1h, trades_v1); noise-band holdout scoring (nb_es_v4) per those families' data-access ledgers: different strategy families, so this is still the first test of this strategy, but the researcher has seen how that period treated them.

metrics:
  return_frequency: daily          # mark-to-market equity at each session close
  periods_per_year: 252            # Sharpe = mean/std(daily) * sqrt(252)
  risk_free_rate_annual: 0.0
  cash_treatment: >-
    Idle cash earns 0% and the Sharpe excess return is measured against a 0%
    risk-free rate, so the two assumptions are consistent.
  drawdown_basis: daily session-close mark-to-market (understates intraday DD)

execution:
  baseline: configs/execution/futures.yaml   # $2.50/contract/side + 1 tick/side slippage, unlevered whole contracts

integrity:            # stage 1
  truncation_check_sample: 40
  truncation_points: 3

trade_count:          # stage 2 -- hard gate
  min_completed_trades: 100
  min_trades_per_year: 10
  min_years_meeting_floor: 4

performance:          # stage 3 -- hard gate
  min_net_return: 0.0               # strictly greater than
  min_sharpe: 0.75                  # annualized, daily MTM returns incl. flat days
  max_drawdown: -0.30
  max_drawdown_source: src/experiments/validation.py::FunnelThresholds.max_dev_drawdown_pct

parameter_stability:  # stage 4 -- hard gate
  mode: local_perturbation          # gate on `local` moves below; grid neighbors are diagnostic only
  local:
    int_rel: 0.20                   # squeeze length, min squeeze bars, setup expiry: x0.8 / x1.2, rounded, >= 1 bar away
    kc_mult_abs: 0.25               # Keltner multiple -/+ 0.25
    min_box_atr_abs: 0.25           # minimum box width -/+ 0.25 ATR (never below 0)
    stop_atr_abs: 0.25              # numeric ATR stop -/+ 0.25 (the box stop has no numeric move)
    target_r_abs: 0.5               # profit target -/+ 0.5R ("none" has no numeric move)
  neighbor_mode: single_axis        # grid-neighbor diagnostic
  min_frac_profitable: 0.70         # of the local moves, share with dev net return > 0
  min_median_sharpe: 0.50           # median dev Sharpe of the local moves
  prescreen:                        # big grids: fixed before the run, like every gate
    max_configs: 3000               # if more than this many pass stage 3, cluster them first (stage-6 rules)
    per_cluster: 3                  # and send only the best 3 per cluster by dev Sharpe into stage 4
  perturbation:                     # diagnostic only, never a gate
    n_per_config: 20
    integer_rel_step: 0.15          # squeeze length, setup expiry
    float_rel_step: 0.10            # Keltner multiple, ATR stop, target, min box width (relative)

time_stability:       # stage 5 -- light hard gate + diagnostics
  min_profitable_years: 3
  top_trades_k: 5
  top_trades_frac: 0.05

dedup:                # stage 6
  corr_threshold: 0.80
  return_basis: monthly
  linkage: complete
  reps_per_cluster: 2               # best 2 per cluster; a single-member cluster keeps its 1

execution_stress:     # stage 7
  gate_cost_multiplier: 1.5         # hard gate: positive dev net return
  diagnostic_cost_multipliers: [2.0]
  entry_delay_bars: 1
  missed_entry_frac: 0.10
  missed_entry_sims: 100
  breakeven_max_multiplier: 25.0

validation:           # stage 8 -- hard gate (frozen representatives only)
  min_net_return: 0.0
  min_sharpe: 0.30
  max_drawdown: -0.30
  min_completed_trades: 40          # project default from 2026-10-22

confidence:           # stage 9 -- diagnostics only
  dsr_threshold: 0.95
  dsr_calibration_verified: false
  effective_trials_method: li_ji
  serial_dependence: lag1_effective_n
  transfer_symbol: NQ                # unchanged rules, development period only

holdout:              # stage 10 -- explicit `final-test` command only
  acceptance:
    min_net_return: 0.0
    min_sharpe: 0.0
    max_drawdown: -0.30
    min_completed_trades: null

# The sibling compression line, earlier trials on this market (other families) and the SPY
# breakout / trend studies (the closest prior searches to this family). These count toward the DSR "known prior"
# sensitivity only.
