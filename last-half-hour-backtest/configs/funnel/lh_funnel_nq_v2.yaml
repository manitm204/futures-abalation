  - name: "compression_breakout_bbkc_v3_15m NQ"
    n_configs: 28800
    note: "Different (BB/KC squeeze) family on NQ."
  - name: "compression_breakout_bbkc_v3_5m NQ"
    n_configs: 27648
    note: "Different (BB/KC squeeze) family on NQ."
  - name: "compression_breakout_nr_v4_15m NQ"
    n_configs: 2304
    note: "Different (NR-N squeeze) family on NQ."
  - name: "emrt_spread_v1 ES-NQ"
    n_configs: 51840
