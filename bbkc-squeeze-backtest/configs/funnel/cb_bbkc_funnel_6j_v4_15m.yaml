# 6J futures (Japanese yen) volatility-compression breakout, BB-inside-KC squeeze line, round 4:
# run cb_bbkc_6j_v4_15m -- the ONE place every threshold lives.
# (compression_breakout_bbkc_v4_15m, 3,840 configs, 15-minute bars only): squeeze length
# 15/25/35/45 bars, Keltner width 1.5/2/2.5/3/3.5 ATR, min squeeze bars 1/4, entry close / wick,
# setup live 1/4 bars, stop box / 1.5 ATR(14), target 1R/2.5R/none, long / both, trend filter
# none / EMA(50), any box width. The same grid as YM round 4 (cb_bbkc_ym_v4_15m), run on 6J at
# the user's request (2026-11-11) after reading the ES, NQ and YM squeeze rounds' development,
# validation and holdout results. No new entries in the last 30 minutes; flat at the session
# close. 6J's day session is 08:20-15:00 NY. See src/strategies/compression_breakout/config.py.
#
# Every gate, threshold, data split and cost is identical to YM v4
# (configs/funnel/cb_bbkc_funnel_ym_v4_15m.yaml) EXCEPT the symbol (and its transfer symbol).
# Stage-4 local moves: squeeze length, min squeeze bars and setup expiry x0.8/x1.2, Keltner multiple -/+ 0.25,
#     ATR stop -/+ 0.25, target -/+ 0.5R, minimum box width -/+ 0.25 ATR.
#
# Thresholds are fixed for the duration of a run and are hashed into every run's
# outputs. They are NEVER adjusted automatically to hit a survivor count; zero
# survivors is a valid outcome. Changing a value here is a new research trial
# and should be recorded under `research_history` below.

version: 1
strategy: compression_breakout_bbkc_v4_15m
symbol: 6J
seed: 20261112

data:
  clean_root: data/clean
  development: {start: 2018-01-01, end: 2022-12-31}
  validation:  {start: 2023-01-01, end: 2024-12-31}
  # end: null -> the actual available endpoint, recorded at access time.
  holdout:     {start: 2025-01-01, end: null}
  timeframes: ["15min"]

data_history:
  validation_previously_used_for_selection: false
  validation_note: >-
    No compression-breakout strategy has been selected or scored on 6J 2023-2024. This grid was chosen after reading ES, NQ and YM squeeze results on 2023-2024 and 2025+. Other families were validated there (mean-reversion: mr_6j_v5), so the period has been looked at by the researcher, but not for this strategy.
  holdout_previously_inspected: false
  holdout_note: >-
    No metrics of any family have been computed on 6J 2025+ (no holdout reads in the mean-reversion or noise-band ledgers).

metrics:
  return_frequency: daily          # mark-to-market equity at each session close
  periods_per_year: 252            # Sharpe = mean/std(daily) * sqrt(252)
  risk_free_rate_annual: 0.0
  cash_treatment: >-
    Idle cash earns 0% and the Sharpe excess return is measured against a 0%
    risk-free rate, so the two assumptions are consistent.
  drawdown_basis: daily session-close mark-to-market (understates intraday DD)

execution:
  baseline: configs/execution/futures.yaml   # $2.50/contract/side + 1 tick/side slippage, unlevered whole contracts

integrity:            # stage 1
  truncation_check_sample: 40
  truncation_points: 3

trade_count:          # stage 2 -- hard gate
  min_completed_trades: 100
  min_trades_per_year: 10
  min_years_meeting_floor: 4

performance:          # stage 3 -- hard gate
  min_net_return: 0.0               # strictly greater than
  min_sharpe: 0.75                  # annualized, daily MTM returns incl. flat days
  max_drawdown: -0.30
  max_drawdown_source: src/experiments/validation.py::FunnelThresholds.max_dev_drawdown_pct

parameter_stability:  # stage 4 -- hard gate
  mode: local_perturbation          # gate on `local` moves below; grid neighbors are diagnostic only
  local:
    int_rel: 0.20                   # squeeze length, min squeeze bars, setup expiry: x0.8 / x1.2, rounded, >= 1 bar away
    kc_mult_abs: 0.25               # Keltner multiple -/+ 0.25
    min_box_atr_abs: 0.25           # minimum box width -/+ 0.25 ATR (never below 0)
    stop_atr_abs: 0.25              # numeric ATR stop -/+ 0.25 (the box stop has no numeric move)
    target_r_abs: 0.5               # profit target -/+ 0.5R ("none" has no numeric move)
  neighbor_mode: single_axis        # grid-neighbor diagnostic
  min_frac_profitable: 0.70         # of the local moves, share with dev net return > 0
  min_median_sharpe: 0.50           # median dev Sharpe of the local moves
  prescreen:                        # big grids: fixed before the run, like every gate
    max_configs: 2000               # if more than this many pass stage 3, cluster them first (stage-6 rules)
    per_cluster: 3                  # and send only the best 3 per cluster by dev Sharpe into stage 4
  perturbation:                     # diagnostic only, never a gate
    n_per_config: 20
    integer_rel_step: 0.15          # squeeze length, setup expiry
    float_rel_step: 0.10            # Keltner multiple, ATR stop, target, min box width (relative)

time_stability:       # stage 5 -- light hard gate + diagnostics
  min_profitable_years: 3
  top_trades_k: 5
  top_trades_frac: 0.05

dedup:                # stage 6
  corr_threshold: 0.80
  return_basis: monthly
  linkage: complete
  reps_per_cluster: 2               # best 2 per cluster; a single-member cluster keeps its 1

execution_stress:     # stage 7
  gate_cost_multiplier: 1.5         # hard gate: positive dev net return
  diagnostic_cost_multipliers: [2.0]
  entry_delay_bars: 1
  missed_entry_frac: 0.10
  missed_entry_sims: 100
  breakeven_max_multiplier: 25.0

validation:           # stage 8 -- hard gate (frozen representatives only)
  min_net_return: 0.0
  min_sharpe: 0.30
  max_drawdown: -0.30
  min_completed_trades: 40          # project default from 2026-10-22

confidence:           # stage 9 -- diagnostics only
  dsr_threshold: 0.95
  dsr_calibration_verified: false
  effective_trials_method: li_ji
  serial_dependence: lag1_effective_n
  transfer_symbol: 6E                # unchanged rules, development period only

holdout:              # stage 10 -- explicit `final-test` command only
  acceptance:
    min_net_return: 0.0
    min_sharpe: 0.0
    max_drawdown: -0.30
    min_completed_trades: null

# The sibling compression line, earlier trials on this market (other families) and the SPY
# breakout / trend studies (the closest prior searches to this family). These count toward the DSR "known prior"
# sensitivity only.
research_history:
  - name: "compression_breakout_bbkc ES v1 (cb_bbkc_es_v1)"
    n_configs: 20736
    note: "Same line on ES, 5min + 15min. This grid was specified after its results."
  - name: "compression_breakout_bbkc_v2_15m ES (cb_bbkc_es_v2_15m)"
    n_configs: 184320
    note: "Same line on ES; 2 tested on 2025+. This grid was specified after its results."
  - name: "compression_breakout_bbkc_v2_5m ES (cb_bbkc_es_v2_5m)"
    n_configs: 72576
    note: "Same line on ES. This grid was specified after its results."
  - name: "compression_breakout_bbkc_v3_15m NQ (cb_bbkc_nq_v3_15m)"
    n_configs: 28800
    note: "Same line on NQ; 1 tested on 2025+. This grid was specified after its results."
  - name: "compression_breakout_bbkc_v3_5m NQ (cb_bbkc_nq_v3_5m)"
    n_configs: 27648
    note: "Same line on NQ; 1 tested on 2025+. This grid was specified after its results."
  - name: "compression_breakout_bbkc_v4_15m YM (cb_bbkc_ym_v4_15m)"
    n_configs: 3840
    note: "This exact grid on YM; 59 frozen, 37 passed 2023-2024, #8 failed the 2025+ holdout. This grid was specified after its results."
  - name: "compression_breakout_nr 6J v1 (cb_nr_6j_v1)"
    n_configs: 16128
    note: "Sibling compression line (NR-N): same backtester and shared breakout axes; both v1 grids were fixed together, before any compression-breakout result was seen."
  - name: "mean_reversion 6J (mr_6j_v5)"
    n_configs: 41472
    note: "Different (mean-reversion) family on 6J; 0 frozen candidates, 0 passed 2023-2024."
  - name: "channel_breakout grid (funnel_v1..v4, SPY)"
    n_configs: 24576
    note: "Closest prior search: channel breakout, SPY; four funnel variants with changed thresholds/methods."
  - name: "donchian_ablation (donchian_v1, SPY/QQQ)"
    n_configs: 3888
    note: "Closest prior search: full-factorial Donchian intraday breakout ablation, 2018-2026 splits incl. holdout."
  - name: "ma_crossover v2 grid (ma_v2, SPY)"
    n_configs: 248832
    note: "Long-only trend-following MA crossover, 5min/15min, SPY."
  - name: "ma_crossover v1 grid (ma_v1, SPY)"
    n_configs: 60000
    note: "Long-only trend-following MA crossover, 5min/15min/1h, SPY."
