[project]
name = "ict-backtest"
version = "0.1.0"
description = "Reusable, extensible backtesting framework with ICT Silver Bullet as the first strategy."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "polars>=1.9",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandas-market-calendars>=4.4",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "typer>=0.12",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "xxhash>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
