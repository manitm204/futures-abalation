# SPY RSI-divergence screening funnel, v2 parameter space (rsi_v2) -- the ONE
# place every threshold lives. Every gate threshold is identical to
# rsi_funnel.yaml (v1); only `strategy` (which selects the 69,984-config v2 grid
# with the RSI-extreme, ADX and minimum-price-divergence filters), the
# timeframes, the data history and the research history differ.
#
# Thresholds are fixed for the duration of a run and are hashed into every run's
# outputs. They are NEVER adjusted automatically to hit a survivor count; zero
# survivors is a valid outcome. Changing a value here is a new research trial
# and should be recorded under `research_history` below.

version: 1
strategy: rsi_divergence_v2
symbol: SPY
seed: 20261016

data:
  clean_root: data/clean
  development: {start: 2018-01-01, end: 2022-12-31}
  validation:  {start: 2023-01-01, end: 2024-12-31}
  # end: null -> the actual available endpoint, recorded at access time.
  holdout:     {start: 2025-01-01, end: null}
  timeframes: ["5min", "15min"]

# What has ALREADY influenced selection. rsi_v1 gated 33 frozen candidates on
# 2023-2024, and this v2 space was written after seeing v1's development AND
# validation results, so validation is previously used data for this family.
data_history:
  validation_previously_used_for_selection: true
  validation_note: >-
    rsi_v1 evaluated 33 frozen RSI-divergence candidates on 2023-2024 (8 passed)
    and the v2 parameter space was designed after those results were read. The
    same slice also gated the mean-reversion funnels, the channel-breakout
    funnels and the Donchian ablation.
  holdout_previously_inspected: true
  holdout_note: >-
    SPY 2025-2026 holdout metrics were computed and inspected for the Donchian
    ablation and the channel-breakout funnels (funnel_v1..v3 records.parquet).
    The holdout is NOT an untouched test of SPY.

metrics:
  return_frequency: daily          # mark-to-market equity at each session close
  periods_per_year: 252            # Sharpe = mean/std(daily) * sqrt(252)
  risk_free_rate_annual: 0.0
  cash_treatment: >-
    Idle cash earns 0% and the Sharpe excess return is measured against a 0%
    risk-free rate, so the two assumptions are consistent. In 2023-2024 the
    real T-bill rate was ~5%, so Sharpe vs. cash is overstated there.
  drawdown_basis: daily session-close mark-to-market (understates intraday DD)

execution:
  baseline: configs/execution/default.yaml   # commission $0.005/sh (min $1), 1bp slippage

integrity:            # stage 1
  truncation_check_sample: 40       # random configs re-run on truncated data (look-ahead test)
  truncation_points: 3

trade_count:          # stage 2 -- hard gate
  min_completed_trades: 150
  min_trades_per_year: 10
  min_years_meeting_floor: 4

performance:          # stage 3 -- hard gate
  min_net_return: 0.0               # strictly greater than
  min_sharpe: 0.75                  # annualized, daily MTM returns incl. flat days
  # Reused from src/experiments/validation.py FunnelThresholds.max_dev_drawdown_pct.
  # Set to null to mark risk approval INCOMPLETE (no limit is invented).
  max_drawdown: -0.30
  max_drawdown_source: src/experiments/validation.py::FunnelThresholds.max_dev_drawdown_pct

parameter_stability:  # stage 4 -- hard gate
  neighbor_mode: single_axis        # immediate neighbors: one step on one ordered axis
  min_frac_profitable: 0.70
  min_median_sharpe: 0.30
  perturbation:                     # diagnostic only, never a gate
    n_per_config: 20
    integer_rel_step: 0.15          # RSI period / pivot widths / pivot gap / max hold +/- up to 15% (>= 1 bar)
    rsi_diff_abs: 1.0               # min RSI difference +/- up to 1 RSI point (never below 0)
    float_rel_step: 0.15            # stop ATR / target R / RSI-extreme & ADX thresholds / min price divergence +/- up to 15% relative (filters that are off stay off)

time_stability:       # stage 5 -- light hard gate + diagnostics
  min_profitable_years: 3
  top_trades_k: 5
  top_trades_frac: 0.05

dedup:                # stage 6
  corr_threshold: 0.80
  return_basis: monthly
  linkage: complete                 # every within-cluster pair has corr >= threshold

execution_stress:     # stage 7
  gate_cost_multiplier: 1.5         # hard gate: positive dev net return
  diagnostic_cost_multipliers: [2.0]
  entry_delay_bars: 1
  missed_entry_frac: 0.10
  missed_entry_sims: 100
  breakeven_max_multiplier: 25.0

validation:           # stage 8 -- hard gate (frozen representatives only)
  min_net_return: 0.0
  min_sharpe: 0.30
  max_drawdown: -0.30
  min_completed_trades: 60

confidence:           # stage 9 -- diagnostics only
  dsr_threshold: 0.95
  # The DSR label stays "unverified" until a person reviews the calibration
  # (effective-trial estimate, prior research count) and flips this flag.
  dsr_calibration_verified: false
  effective_trials_method: li_ji    # li_ji | participation_ratio | raw
  serial_dependence: lag1_effective_n
  transfer_symbol: QQQ              # unchanged rules, development period only

holdout:              # stage 10 -- explicit `final-test` command only
  acceptance:
    min_net_return: 0.0
    min_sharpe: 0.0
    max_drawdown: -0.30
    min_completed_trades: null

# Known earlier research trials on this data. Used for DSR sensitivity and to
# stop the search history from being silently erased.
research_history:
  - name: ict_silver_bullet_search
    n_configs: null
    note: "Earlier ICT Silver Bullet search on the same SPY data; trial count not recorded."
  - name: donchian_ablation (donchian_v1)
    n_configs: 3888
    note: "Full-factorial Donchian intraday ablation, 2018-2026 splits incl. holdout."
  - name: channel_breakout grid (funnel_v1, v2_screened, v3_dsr, v4_dev)
    n_configs: 24576
    note: "Channel-breakout grid on the same SPY data; four funnel variants with changed thresholds/methods."
  - name: mean_reversion v1 grid (mr_v1)
    n_configs: 75000
    note: "Mean-reversion v1 on the same SPY data; 15 frozen candidates, 0 passed validation."
  - name: mean_reversion v2 grid (mr_v2)
    n_configs: 240000
    note: "Mean-reversion v2 on the same SPY data; 4 frozen candidates, 1 passed validation (2023-2024)."
  - name: rsi_divergence v1 grid (rsi_v1)
    n_configs: 98304
    note: "Same strategy family, earlier parameter space; 33 frozen candidates, 8 passed validation (2023-2024)."
