const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const pct = (x, d = 2) => (x == null || !isFinite(x)) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d) + "%";
const num = (x, d = 2) => (x == null || !isFinite(x)) ? "–" : (x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const money = (x) => (x < 0 ? "−$" : x > 0 ? "+$" : "$") + (Math.abs(x) / 1000).toFixed(1) + "k";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const XR = { z_exit: "z exit", time_exit: "time", stop_exit: "stop", forced_close: "forced" };
const PER = { is: "2018–24", ho: "Holdout" };
let N = 2;

const isRe = (t) => t.prev === "stop_exit" && t.gap != null && t.gap <= N;
function agg(tr) {
  const n = tr.length;
  if (!n) return { n: 0, mean: NaN, win: NaN, pf: NaN, sum: 0, pnl: 0 };
  const sum = tr.reduce((a, t) => a + t.r, 0);
  const gp = tr.filter((t) => t.pnl > 0).reduce((a, t) => a + t.pnl, 0), gl = -tr.filter((t) => t.pnl < 0).reduce((a, t) => a + t.pnl, 0);
  return { n, mean: sum / n, win: tr.filter((t) => t.r > 0).length / n, pf: gl ? gp / gl : (gp ? Infinity : NaN), sum, pnl: gp - gl };
}
// A chain: a stopped-out trade followed by one or more re-entries (each within N bars of a stop).
function chains(tr) {
  const out = [];
  for (let i = 0; i < tr.length; i++) {
    if (isRe(tr[i])) continue;
    const c = [tr[i]];
    while (i + 1 < tr.length && isRe(tr[i + 1]) && c[c.length - 1].x === "stop_exit") c.push(tr[++i]);
    if (c.length > 1) out.push(c);
  }
  return out;
}
const hasStop = (s) => s.settings.stop_atr_multiple !== "none";

function barChart(s) {
  const cells = [];
  for (const k of ["is", "ho"]) {
    const re = agg(s[k].filter(isRe)), ot = agg(s[k].filter((t) => !isRe(t)));
    cells.push({ k, lab: "Other trades", a: ot }, { k, lab: "Re-entries", a: re, re: true });
  }
  const W = 520, H = 200, L = 44, R = 8, T = 18, B = 44;
  const vals = cells.map((c) => c.a.mean).filter(isFinite);
  let ymax = Math.max(0.05, ...vals.map((v) => v)), ymin = Math.min(-0.05, ...vals);
  const pad = (ymax - ymin) * 0.15; ymax += pad; ymin -= pad;
  const y = (v) => T + (H - T - B) * (ymax - v) / (ymax - ymin);
  const slot = (W - L - R) / 4, bw = slot * 0.55;
  let g = `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average trade, re-entries vs other trades">`;
  const steps = [ymin, 0, ymax].map((v) => +v.toFixed(2));
  for (const v of new Set([0, +(ymax * 0.7).toFixed(2), +(ymin * 0.7).toFixed(2)]))
    g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke-opacity="0.5"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${pct(v, 2)}</text>`;
  g += `<line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  cells.forEach((c, i) => {
    const cx = L + slot * i + slot / 2;
    if (c.a.n && isFinite(c.a.mean)) {
      const top = Math.min(y(c.a.mean), y(0)), h = Math.abs(y(c.a.mean) - y(0));
      g += `<rect class="${c.k === "is" ? "b-is" : "b-ho"}${c.re ? " b-re" : ""}" x="${cx - bw / 2}" y="${top}" width="${bw}" height="${Math.max(h, 1)}"/>`;
      g += `<text class="val" x="${cx}" y="${c.a.mean >= 0 ? top - 4 : top + h + 12}" text-anchor="middle">${pct(c.a.mean, 2)}</text>`;
    } else g += `<text x="${cx}" y="${y(0) - 4}" text-anchor="middle">none</text>`;
    g += `<text x="${cx}" y="${H - 24}" text-anchor="middle">${c.lab}</text><text x="${cx}" y="${H - 11}" text-anchor="middle">${PER[c.k]} · n=${c.a.n}</text>`;
  });
  return g + `</svg>`;
}

      if (!ch.length) { card.insertAdjacentHTML("beforeend", `<div class="worst">${PER[k]}: no chains.</div>`); continue; }
      const show = k === "ho" ? ch : [...ch].sort((a, b) => a.reduce((x, t) => x + t.r, 0) - b.reduce((x, t) => x + t.r, 0)).slice(0, 8);
      const lines = show.map((c) => `<div class="chain">${c.map((t, i) => `${i ? " → " : ""}<span class="${t.x === "stop_exit" ? "st" : ""}">${pct(t.r)}</span>`).join("")} · total ${pct(c.reduce((x, t) => x + t.r, 0))} · ${esc(c[0].et)}${c.length > 1 ? " to " + esc(c[c.length - 1].xt.slice(5)) : ""}</div>`).join("");
      card.insertAdjacentHTML("beforeend", `<details${k === "ho" ? " open" : ""}><summary>${PER[k]}: ${ch.length} chain${ch.length === 1 ? "" : "s"}${k === "is" && ch.length > 8 ? " (8 worst shown)" : ""}</summary>${lines}</details>`);
    }
    grid.append(card);
  }
  sec.append(grid);
  sec.append($(`<p class="muted">In the chain lists, red marks a trade that ended on its stop. Times are New York bar-open times: the first entry, then the last exit.</p>`));
  app.append(sec);

  // Check: what follows other exit types
  const by = (k, why) => S.flatMap((s) => s[k]).filter((t) => t.prev === why && t.gap != null && t.gap <= N).length;
  app.append($(`<section><div class="eyebrow">Check</div><h2>Fast re-entries after other exits</h2>
    <p class="muted">Trades starting within ${N} bar${N === 1 ? "" : "s"} of the previous exit, by how that exit happened (all 12 strategies). After a time exit, z must close above the entry level at least once before a new buy, so the earliest re-entry is 2 bars later, on a fresh dip. After a z exit, a 1-bar re-entry needs the price to crash again within the exit bar, which is rare.</p>
    <div class="card tbl-wrap"><table><thead><tr><th>Previous exit</th><th>2018–24</th><th>Holdout</th></tr></thead><tbody>
    ${["stop_exit", "z_exit", "time_exit"].map((w) => `<tr><td>${XR[w]}</td><td>${by("is", w)}</td><td class="ho">${by("ho", w)}</td></tr>`).join("")}
    </tbody></table></div></section>`));
}
render();
</script>
</body>
</html>
