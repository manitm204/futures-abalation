# GC futures (COMEX gold) drift-burst fade, v3: run db_gc_v3 (drift_burst_v3, 1,296 configs,
# 1-minute bars of the COMEX day session 08:20-13:30 NY) -- the ONE place every threshold lives.
#
# Specified by the user (2026-11-26): try the same trimmed grid on other markets (forex pair, gold) to finish the family. The grid was trimmed from ES results, not tuned for GC. The grid is the ES v2 grid
# trimmed to what looked best there (db_es_v2: 10,368 configs, 0 passed the profit gate, 170 made
# money, best dev Sharpe 0.47): volume gate 2x/3x only, threshold 4.5/5.0 only, one trade per session.
# Kept: burst window 3/5/10, side both/long_only, hold 5/15/30, entry cross/peak/confirm, target
# none/0.5/1.0, stop none/1.0 (3x2x2x2x3x3x3x2 = 1,296). This trimming uses ES development results.
#
# Gates, data splits and costs are identical to db_funnel_es_v2.yaml. Thresholds are fixed for the
# duration of a run and hashed into every run's outputs; zero survivors is a valid outcome.

version: 1
strategy: drift_burst_v3
symbol: GC
seed: 20261126

data:
  clean_root: data/clean
  development: {start: 2018-01-01, end: 2022-12-31}
  validation:  {start: 2023-01-01, end: 2024-12-31}
  # end: null -> the actual available endpoint, recorded at access time.
  holdout:     {start: 2025-01-01, end: null}
  timeframes: ["1min"]

data_history:
  validation_previously_used_for_selection: true
  validation_note: >-
    No drift-burst strategy has been scored on GC 2023-2024 (ES v1/v2 and NQ v3 froze nothing), but the mean-reversion, noise-band, BB/KC squeeze, NR-N and convexity families were selected there and the researcher has read those results. Treated as used for selection.
  holdout_previously_inspected: false   # not for this line; see the note
  holdout_note: >-
    No drift-burst metrics have been computed on GC 2025+. Other families (mean reversion, noise band, BB/KC squeeze, NR-N, convexity, EMRT ES-RTY) were scored there, so the researcher has seen how that period treated intraday ES strategies.

metrics:
  return_frequency: daily          # mark-to-market equity at each session close
  periods_per_year: 252            # Sharpe = mean/std(daily) * sqrt(252)
  risk_free_rate_annual: 0.0
  cash_treatment: >-
    Idle cash earns 0% and the Sharpe excess return is measured against a 0%
    risk-free rate, so the two assumptions are consistent.
  drawdown_basis: daily session-close mark-to-market (understates intraday DD)

execution:
  baseline: configs/execution/futures.yaml   # $2.50/contract/side + 1 tick/side slippage, unlevered whole contracts

integrity:            # stage 1
  truncation_check_sample: 40
  truncation_points: 3

trade_count:          # stage 2 -- hard gate
  min_completed_trades: 100
  min_trades_per_year: 10
  min_years_meeting_floor: 4

performance:          # stage 3 -- hard gate
  min_net_return: 0.0               # strictly greater than
  min_sharpe: 0.75                  # annualized, daily MTM returns incl. flat days
  max_drawdown: -0.30
  max_drawdown_source: src/experiments/validation.py::FunnelThresholds.max_dev_drawdown_pct

parameter_stability:  # stage 4 -- hard gate
  mode: local_perturbation          # gate on `local` moves below; grid neighbors are diagnostic only
  local:
    int_rel: 0.20                   # burst window, hold: x0.8 / x1.2, rounded, >= 1 minute away
    stop_atr_abs: 0.25              # unused by this family (no stop); required field
    threshold_abs: 0.25             # burst t-stat threshold -/+ 0.25 (never below 2.0)
    vol_gate_abs: 0.25              # volume-ratio gate -/+ 0.25 (never below 1.0; "none" has no move)
    target_abs: 0.25                # target -/+ 0.25 x the burst move (never below 0.1; "none" has no move)
    stop_burst_abs: 0.25            # stop -/+ 0.25 x the burst move (never below 0.25; "none" has no move)
    max_trades_step: 1              # trades per session -/+ 1 (never below 1)
  neighbor_mode: single_axis        # grid-neighbor diagnostic
  min_frac_profitable: 0.70         # of the local moves, share with dev net return > 0
  min_median_sharpe: 0.50           # median dev Sharpe of the local moves
  prescreen:                        # big grids: fixed before the run, like every gate
    max_configs: 3000
    per_cluster: 3
  perturbation:                     # diagnostic only, never a gate
    n_per_config: 20
    integer_rel_step: 0.15          # burst window, hold
    float_rel_step: 0.10            # threshold, volume gate, target, stop (relative)

time_stability:       # stage 5 -- light hard gate + diagnostics
  min_profitable_years: 3
  top_trades_k: 5
  top_trades_frac: 0.05

dedup:                # stage 6
  corr_threshold: 0.80
  return_basis: monthly
  linkage: complete
  reps_per_cluster: 2               # best 2 per cluster; a single-member cluster keeps its 1

execution_stress:     # stage 7
  gate_cost_multiplier: 1.5         # hard gate: positive dev net return
  diagnostic_cost_multipliers: [2.0]
  entry_delay_bars: 1               # one 1-minute bar late
  missed_entry_frac: 0.10
  missed_entry_sims: 100
  breakeven_max_multiplier: 25.0

validation:           # stage 8 -- hard gate (frozen representatives only)
  min_net_return: 0.0
  min_sharpe: 0.30
  max_drawdown: -0.30
  min_completed_trades: 40          # project default from 2026-10-22

confidence:           # stage 9 -- diagnostics only
  dsr_threshold: 0.95
  dsr_calibration_verified: false
  effective_trials_method: li_ji
  serial_dependence: lag1_effective_n
  transfer_symbol: ES                # unchanged rules, development period only

holdout:              # stage 10 -- explicit `final-test` command only
  acceptance:
    min_net_return: 0.0
    min_sharpe: 0.0
    max_drawdown: -0.30
    min_completed_trades: null

